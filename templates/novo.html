{% extends "base.html" %}

{% block titulo %}Dark Library — Novo livro{% endblock %}

{% block conteudo %}

    <div class="pagina-cabecalho">
        <h1>Novo livro</h1>
        <a href="{{ url_for('home') }}" class="link-voltar">← Voltar</a>
    </div>

    <form method="POST" class="form-cadastro">

        <div class="campo">
            <label for="titulo">Título <span class="obrigatorio">*</span></label>
            <input type="text" id="titulo" name="titulo" required maxlength="200" autofocus>
        </div>

        <div class="campo">
            <label for="autor">Autor <span class="obrigatorio">*</span></label>
            <input type="text" id="autor" name="autor" required maxlength="150">
        </div>

        <div class="campo-linha">
            <div class="campo">
                <label for="nacionalidade">Nacionalidade</label>
                <input type="text" id="nacionalidade" name="nacionalidade" maxlength="80" placeholder="Ex.: Brasileira">
            </div>

            <div class="campo">
                <label for="estante">Estante</label>
                <input type="text" id="estante" name="estante" maxlength="20" placeholder="Ex.: A1, B10">
            </div>
        </div>

        <div class="campo">
            <label for="cor_lombada">Cor da lombada</label>
            <select id="cor_lombada" name="cor_lombada">
                <option value="">— Selecione —</option>
                {% for cor in cores %}
                    <option value="{{ cor }}">{{ cor }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="campo">
            <label for="isbn">ISBN (opcional)</label>
            <input type="text" id="isbn" name="isbn" maxlength="20" inputmode="numeric" placeholder="Ex.: 9788535914849">
        </div>

        <div class="campo-checkbox">
            <input type="checkbox" id="lido" name="lido">
            <label for="lido">Já li este livro</label>
        </div>

        <div class="acoes-form">
            <button type="submit">Salvar</button>
            <a href="{{ url_for('home') }}" class="link-cancelar">Cancelar</a>
        </div>

    </form>

{% endblock %}
