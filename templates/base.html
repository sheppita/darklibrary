<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Dark Library{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>

    <header class="cabecalho">
        <div class="cabecalho-conteudo">
            <a href="{{ url_for('home') }}" class="logo">Dark Library</a>
                 <nav class="menu">
                      <a href="{{ url_for('home') }}">Início</a>
                      <a href="{{ url_for('novo') }}">+ Novo</a>
                      <a href="{{ url_for('estatisticas') }}">Estatísticas</a>
                     <a href="{{ url_for('backup') }}" class="link-backup">Baixar backup</a>
                </nav>
        </div>
    </header>

    <main class="conteudo">
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="rodape">
        <p>Dark Library — biblioteca pessoal</p>
    </footer>

</body>
</html>
