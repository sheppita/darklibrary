{% extends "base.html" %}

{% block titulo %}Dark Library — Editar livro{% endblock %}

{% block conteudo %}

    <div class="pagina-cabecalho">
        <h1>Editar livro</h1>
        <a href="{{ url_for('home') }}" class="link-voltar">← Voltar</a>
    </div>

    <form method="POST" class="form-cadastro">

        <div class="campo">
            <label for="isbn">ISBN</label>
            <div class="campo-com-botao">
                <input type="text" id="isbn" name="isbn" maxlength="20" inputmode="numeric"
                       value="{{ livro.isbn or '' }}"
                       placeholder="Ex.: 9788535914849">
                <button type="button" id="btn-buscar-isbn" class="botao-secundario">Buscar ISBN</button>
            </div>
            <div id="mensagem-isbn" class="mensagem-isbn" hidden></div>
        </div>

        <div class="campo">
            <label for="capa_url">URL da capa (opcional)</label>
            <input type="text" id="capa_url" name="capa_url" maxlength="500"
                   value="{{ livro.capa_url or '' }}"
                   placeholder="Deixe vazio para buscar automático, ou cole uma URL de imagem">
            <div id="preview-capa" class="preview-capa" {% if not livro.capa_url %}hidden{% endif %}>
                <img id="preview-capa-img" src="{{ livro.capa_url or '' }}" alt="Prévia da capa">
            </div>
        </div>

        <div class="campo">
            <label for="titulo">Título <span class="obrigatorio">*</span></label>
            <input type="text" id="titulo" name="titulo" required maxlength="200" value="{{ livro.titulo }}">
        </div>

        <div class="campo">
            <label for="autor">Autor <span class="obrigatorio">*</span></label>
            <input type="text" id="autor" name="autor" required maxlength="150" value="{{ livro.autor }}">
        </div>

        <div class="campo-linha">
            <div class="campo">
                <label for="pais">País</label>
                <input type="text" id="pais" name="pais" maxlength="80"
                       value="{{ livro.pais or '' }}"
                       placeholder="Ex.: Brasil">
            </div>

            <div class="campo">
                <label for="estante">Estante</label>
                <input type="text" id="estante" name="estante" maxlength="20"
                       value="{{ livro.estante or '' }}"
                       placeholder="Ex.: A1, B10">
            </div>
        </div>

        <div class="campo">
            <label for="cor_lombada">Cor da lombada</label>
            <select id="cor_lombada" name="cor_lombada">
                <option value="">— Selecione —</option>
                {% for cor in cores %}
                    <option value="{{ cor }}" {% if cor == livro.cor_lombada %}selected{% endif %}>{{ cor }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="campo-checkbox">
            <input type="checkbox" id="lido" name="lido" {% if livro.lido %}checked{% endif %}>
            <label for="lido">Já li este livro</label>
        </div>

        <div class="acoes-form">
            <button type="submit">Salvar alterações</button>
            <a href="{{ url_for('home') }}" class="link-cancelar">Cancelar</a>
        </div>

    </form>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const botao = document.getElementById("btn-buscar-isbn");
            const inputIsbn = document.getElementById("isbn");
            const inputTitulo = document.getElementById("titulo");
            const inputAutor = document.getElementById("autor");
            const inputCapa = document.getElementById("capa_url");
            const mensagem = document.getElementById("mensagem-isbn");
            const previewCapa = document.getElementById("preview-capa");
            const previewCapaImg = document.getElementById("preview-capa-img");

            function mostrarMensagem(texto, tipo) {
                mensagem.textContent = texto;
                mensagem.className = "mensagem-isbn mensagem-isbn-" + tipo;
                mensagem.hidden = false;
            }

            function mostrarPreview(url) {
                if (!url) {
                    previewCapa.hidden = true;
                    return;
                }
                previewCapaImg.src = url;
                previewCapa.hidden = false;
            }

            previewCapaImg.addEventListener("error", function () {
                previewCapa.hidden = true;
            });

            inputCapa.addEventListener("input", function () {
                mostrarPreview(inputCapa.value.trim());
            });

            botao.addEventListener("click", async function () {
                const isbn = inputIsbn.value.trim();

                if (!isbn) {
                    mostrarMensagem("Digite um ISBN primeiro.", "erro");
                    return;
                }

                botao.disabled = true;
                botao.textContent = "Buscando...";
                mensagem.hidden = true;

                try {
                    const resposta = await fetch("/api/buscar_isbn/" + encodeURIComponent(isbn));
                    const dados = await resposta.json();

                    if (!resposta.ok) {
                        mostrarMensagem(dados.erro || "Livro não encontrado.", "erro");
                        return;
                    }

                    let camposPreenchidos = [];
                    if (!inputTitulo.value.trim() && dados.titulo) {
                        inputTitulo.value = dados.titulo;
                        camposPreenchidos.push("título");
                    }
                    if (!inputAutor.value.trim() && dados.autor) {
                        inputAutor.value = dados.autor;
                        camposPreenchidos.push("autor");
                    }

                    // Em edição, sobrescreve a capa só se o campo estiver vazio.
                    if (dados.capa && !inputCapa.value.trim()) {
                        inputCapa.value = dados.capa;
                        mostrarPreview(dados.capa);
                    }

                    if (camposPreenchidos.length === 0) {
                        mostrarMensagem(
                            "Livro encontrado, mas os campos já estavam preenchidos.",
                            "aviso"
                        );
                    } else {
                        mostrarMensagem(
                            "Encontrado (" + dados.fonte + ")! " + camposPreenchidos.join(" e ") + " preenchido(s).",
                            "sucesso"
                        );
                    }
                } catch (erro) {
                    mostrarMensagem("Erro de conexão. Tente de novo.", "erro");
                } finally {
                    botao.disabled = false;
                    botao.textContent = "Buscar ISBN";
                }
            });
        });
    </script>

{% endblock %}
