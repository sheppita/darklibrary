<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Dark Library{% endblock %}</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>

    <div class="banner">
        <a href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Dark Library">
        </a>
    </div>

    <nav class="menu">
        <a href="{{ url_for('home') }}">Início</a>
        <a href="{{ url_for('novo') }}">Novo</a>
        <a href="{{ url_for('projetos') }}">Projetos</a>
        <a href="{{ url_for('estatisticas') }}">Estatísticas</a>
        <a href="{{ url_for('backup') }}">Backup</a>
    </nav>

    <main class="conteudo">
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="rodape">
        <p>Dark Library — Biblioteca Pessoal</p>
    </footer>

    {# ─────────── Botões de navegação rápida (A11) ─────────── #}
    <div class="navegacao-rapida" aria-label="Navegação rápida">
        <button type="button" id="btn-ir-topo" class="botao-navegacao" aria-label="Ir para o Topo" title="Ir para o Topo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
        </button>
        <button type="button" id="btn-ir-fundo" class="botao-navegacao" aria-label="Ir para o Fundo" title="Ir para o Fundo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const btnTopo = document.getElementById("btn-ir-topo");
            const btnFundo = document.getElementById("btn-ir-fundo");

            if (btnTopo) {
                btnTopo.addEventListener("click", function () {
                    window.scrollTo({ top: 0, behavior: "smooth" });
                });
            }

            if (btnFundo) {
                btnFundo.addEventListener("click", function () {
                    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
                });
            }
        });
    </script>

</body>
</html>
